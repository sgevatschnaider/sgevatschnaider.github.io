name: Portal checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - name: Verify published pages match source
        run: |
          node scripts/sync.mjs
          git diff --exit-code -- index.html es en simulaciones assets/catalog.json assets/site.css assets/site.js assets/zkp.js assets/konigsberg.js

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisión adaptable del portal</title><style>body{font:15px system-ui;background:#e8ece9;color:#183c38;margin:20px}header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:20px}label{display:grid;gap:5px}select{font:inherit;padding:8px}iframe{display:block;border:1px solid #647b71;background:#fff;max-width:100%;height:850px}p{max-width:70ch}a{color:inherit}</style></head><body><h1>Revisión adaptable del portal</h1><p>Vista de comprobación para mantenimiento. El contenido se carga desde las mismas páginas publicadas.</p><header><label>Ancho de la vista<select id="width"><option>320</option><option>375</option><option>768</option><option>1024</option></select></label><label>Página<select id="page"><option value="../es/">Portada · ES</option><option value="../en/">Home · EN</option><option value="../es/simulaciones/zkp/">ZKP · ES</option><option value="../en/simulations/zkp/">ZKP · EN</option><option value="../es/articulos/tiktok/">TikTok · ES</option><option value="../en/articles/expander/">Expander · EN</option></select></label><a href="../es/">Volver al portal</a></header><iframe id="preview" title="Vista del portal" src="../es/" width="320" height="850"></iframe><script>const preview=document.getElementById('preview');document.getElementById('width').addEventListener('change',e=>preview.width=e.target.value);document.getElementById('page').addEventListener('change',e=>preview.src=e.target.value);</script></body></html>
